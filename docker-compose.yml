name: insider-one-notification-system

x-app: &app
  build:
    context: .
    args:
      VERSION: ${VERSION:-dev}
      COMMIT: ${COMMIT:-unknown}
      BUILD_DATE: ${BUILD_DATE:-unknown}
  image: insider-one-notification-system:local

x-env: &env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-notifications}?sslmode=disable
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-https://webhook.site/replace-with-your-uuid}
  PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-10s}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-50}
  RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-100}
  RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-1}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  WS_ENABLED: ${WS_ENABLED:-true}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["/app/migrate", "up"]
    environment:
      <<: *env
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["/app/api"]
    environment:
      <<: *env
      HTTP_ADDR: ":8080"
    ports:
      - "${API_PORT:-8081}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *app
    command: ["/app/worker"]
    environment:
      <<: *env
      HTTP_ADDR: ":8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
