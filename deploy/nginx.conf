worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 80;
        client_max_body_size 10m;

        # Docker's embedded DNS server. The variable in proxy_pass forces
        # nginx to re-resolve the API when a container is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        set $swagger_upstream http://swagger-ui:8080;

        location = /api/v1/ws {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header Connection "";

            proxy_connect_timeout 2s;
            proxy_send_timeout 35s;
            proxy_read_timeout 35s;
        }

        location = /healthz {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
        }

        location = /readyz {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
        }

        location = /metrics {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
        }

        location = /docs {
            return 308 $scheme://$http_host/docs/;
        }

        location /docs/ {
            proxy_pass $swagger_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /openapi.yaml {
            proxy_pass $swagger_upstream/docs/openapi.yaml;
            proxy_set_header Host $host;
        }

        location = / {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
        }
    }
}
